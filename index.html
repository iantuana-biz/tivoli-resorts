<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tivoli Group of Resorts Booking Price Estimator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind to use Inter font and custom colors if needed -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#FF5A5F', // Primary Red
                        'secondary': '#484848',
                        'accent': '#00A699',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom styles for smoother transitions */
        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Custom style for the slider track color */
        input[type=range]::-webkit-slider-runnable-track {
            background: #e5e7eb;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #FF5A5F; /* Primary color */
            cursor: pointer;
            margin-top: -6px; /* Adjust for track height */
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div id="app" class="w-full max-w-lg bg-white rounded-xl overflow-hidden card-shadow">
        
        <header class="bg-primary p-6 text-white text-center">
            <h1 class="text-3xl font-extrabold tracking-tight">Tivoli Group of Resorts<br>Booking Price Estimator</h1>
            <p class="text-sm opacity-90 mt-1">Estimate the cost of your next stay with us.</p>
        </header>

        <main class="p-6 space-y-6">

            <!-- Input Fields -->
            <div class="space-y-4">
                
                <!-- House Selection -->
                <div>
                    <label for="houseSelect" class="block text-sm font-medium text-secondary mb-1">Select House</label>
                    <select id="houseSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 ease-in-out">
                        <option value="A" selected>Amansara (Max 7 Rooms, Max 50 Guests)</option>
                        <option value="B">One Tivoli (Max 5 Rooms, Max 50 Guests)</option>
                        <option value="C">Maywood (Max 4 Rooms, Max 25 Guests)</option>
                    </select>
                </div>

                <!-- Date Selection -->
                <div class="flex space-x-4">
                    <div class="w-1/2">
                        <label for="checkInDate" class="block text-sm font-medium text-secondary mb-1">Check-in Date</label>
                        <input type="date" id="checkInDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 ease-in-out">
                    </div>
                    <div class="w-1/2">
                        <label for="checkOutDate" class="block text-sm font-medium text-secondary mb-1">Check-out Date</label>
                        <input type="date" id="checkOutDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 ease-in-out">
                    </div>
                </div>

                <!-- Guest Capacity Slider and Number Box -->
                <div>
                    <label for="guestsSlider" class="block text-sm font-medium text-secondary mb-1 flex justify-between items-center">
                        <span id="guestLabel">Number of Guests (1 - 50)</span>
                        <span id="guestCountDisplay" class="font-bold text-primary text-xl">1</span>
                    </label>
                    <div class="flex items-center space-x-4">
                        <!-- The max attribute will be dynamically set by JS on load/change -->
                        <input type="range" id="guestsSlider" min="1" max="50" value="1" step="1" 
                               class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer range-lg">
                        <input type="number" id="guestsNumber" min="1" max="50" value="1"
                               class="w-16 p-2 border border-gray-300 rounded-lg text-center focus:ring-primary focus:border-primary">
                    </div>
                </div>

            </div>
            
            <!-- Result Display -->
            <div id="resultContainer" class="p-4 bg-primary bg-opacity-10 rounded-lg border border-primary transition-all duration-300 ease-out hidden">
                
                <!-- ESTIMATED TOTAL PRICE DISPLAY -->
                <h3 class="text-xl font-bold text-secondary mb-2">Estimated Total:</h3>
                <p id="totalPriceDisplay" class="text-3xl font-extrabold text-primary mb-4">₱0.00</p> 

                <!-- REQUIRED ROOMS DISPLAY -->
                <h3 class="text-xl font-bold text-secondary mb-2">Required Rooms:</h3>
                <p id="roomsRequiredDisplay" class="text-3xl font-extrabold text-primary">0</p> 
                
                <!-- DETAILED BREAKDOWN -->
                <p id="detailsDisplay" class="text-sm text-secondary mt-4"></p>
            </div>

            <!-- Error/Message Box -->
            <div id="messageBox" class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg transition-all duration-300 ease-out hidden" role="alert">
                <p id="errorMessage"></p>
            </div>
            
        </main>
    </div>

    <script>
        const houseSelect = document.getElementById('houseSelect');
        const checkInDate = document.getElementById('checkInDate');
        const checkOutDate = document.getElementById('checkOutDate');
        const guestsSlider = document.getElementById('guestsSlider');
        const guestsNumber = document.getElementById('guestsNumber');
        const guestCountDisplay = document.getElementById('guestCountDisplay');
        const guestLabel = document.getElementById('guestLabel');
        const resultContainer = document.getElementById('resultContainer');
        const totalPriceDisplay = document.getElementById('totalPriceDisplay');
        const roomsRequiredDisplay = document.getElementById('roomsRequiredDisplay'); 
        const detailsDisplay = document.getElementById('detailsDisplay');
        const messageBox = document.getElementById('messageBox');
        const errorMessage = document.getElementById('errorMessage');
        
        // Configuration Constants
        const CURRENCY_SYMBOL = '₱';
        const SERVICE_FEE = 0; // Set to 0 as requested to remove the service fee.
        
        // --- PRICING STRUCTURE ---
        const PRICING = {
            'A': { // Amansara - FIXED TIERED PRICING
                maxRooms: 7, 
                maxGuests: 50,
                pricingType: 'fixed',
                rates: [
                    { guests: [1, 20], weekday: 16000, friday: 22000, weekend: 28000 },
                    { guests: [21, 25], weekday: 18000, friday: 24000, weekend: 28000 },
                    { guests: [26, 30], weekday: 20000, friday: 26000, weekend: 30000 },
                    { guests: [31, 35], weekday: 22000, friday: 28000, weekend: 32000 },
                    { guests: [36, 40], weekday: 24000, friday: 30000, weekend: 34000 },
                    { guests: [41, 50], weekday: 26000, friday: 32000, weekend: 35000 }, 
                ],
                // Room Tiers for Display 
                roomTiers: [
                    { guests: 1, rooms: 3 }, { guests: 21, rooms: 4 }, { guests: 26, rooms: 5 }, 
                    { guests: 31, rooms: 6 }, { guests: 41, rooms: 7 }
                ]
            },
            'B': { // One Tivoli - FIXED TIERED PRICING
                maxRooms: 5, 
                maxGuests: 50,
                pricingType: 'fixed', 
                rates: [
                    { guests: [1, 20], weekday: 16000, friday: 22000, weekend: 28000 },
                    { guests: [21, 30], weekday: 18000, friday: 25000, weekend: 30000 },
                    { guests: [31, 35], weekday: 20000, friday: 28000, weekend: 32000 },
                    { guests: [36, 40], weekday: 22000, friday: 30000, weekend: 34000 },
                    { guests: [41, 50], weekday: 26000, friday: 32000, weekend: 35000 }, 
                ],
                // Room Tiers for Display 
                roomTiers: [
                    { guests: 1, rooms: 2 }, { guests: 21, rooms: 3 }, { guests: 31, rooms: 4 }, 
                    { guests: 36, rooms: 5 }
                ]
            },
            'C': { // Maywood - FIXED TIERED PRICING
                maxRooms: 4, 
                maxGuests: 25,
                pricingType: 'fixed', 
                rates: [
                    { guests: [1, 10], weekday: 10000, friday: 14000, weekend: 18000 },
                    { guests: [11, 19], weekday: 11000, friday: 15000, weekend: 19000 },
                    { guests: [20, 25], weekday: 12000, friday: 16000, weekend: 20000 },
                ],
                // Room Tiers for Display 
                roomTiers: [
                    { guests: 1, rooms: 2 }, { guests: 11, rooms: 3 }, { guests: 20, rooms: 4 }
                ]
            },
        };

        // Set initial min date to today
        const today = new Date().toISOString().split('T')[0];
        checkInDate.setAttribute('min', today);
        checkOutDate.setAttribute('min', today);

        // --- Utility Function for Currency Formatting (with digit group separator) ---
        function formatCurrency(amount) {
            // Use Intl.NumberFormat for Philippine Pesos (en-PH) to ensure
            // comma separators (digit grouping) and two decimal places.
            return new Intl.NumberFormat('en-PH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }
        
        // --- Core Logic: Determine Rooms based on Guest Count ---
        function getRoomsByGuestCount(houseId, guests, maxRooms) {
            const houseData = PRICING[houseId];
            let requiredRooms = 2; // Default minimum room count

            // Use the tiered array specific to the house
            const tiers = houseData.roomTiers;

            // Find the highest tier that the current guest count qualifies for
            for (let i = tiers.length - 1; i >= 0; i--) {
                if (guests >= tiers[i].guests) {
                    requiredRooms = tiers[i].rooms;
                    break;
                }
            }
            
            // Ensure the calculated room count does not exceed the house's maximum capacity
            const finalRooms = Math.min(requiredRooms, maxRooms);

            // The absolute minimum room count based on the tier system is 2 (for 1-10 or 1-20 guests)
            return Math.max(finalRooms, 2); 
        }

        // --- Guest Input Sync Function ---
        function syncGuestInputs() {
            const value = parseInt(guestsSlider.value);
            guestsNumber.value = value;
            guestCountDisplay.textContent = value;
            calculateEstimate(); 
        }

        guestsSlider.addEventListener('input', syncGuestInputs);
        guestsNumber.addEventListener('input', () => {
            let value = parseInt(guestsNumber.value);
            const max = parseInt(guestsNumber.max);
            const min = parseInt(guestsNumber.min);
            
            if (isNaN(value) || value < min) {
                value = min;
            } else if (value > max) {
                value = max;
            }
            
            guestsNumber.value = value;
            guestsSlider.value = value;
            guestCountDisplay.textContent = value;
            calculateEstimate(); 
        });
        
        // Function to update the max attributes on the guests inputs and the label
        function updateGuestConstraints() {
            const houseId = houseSelect.value;
            const houseData = PRICING[houseId];
            const maxGuests = houseData.maxGuests; 

            // 1. Update Guest Constraints (Max)
            guestsSlider.setAttribute('max', maxGuests); 
            guestsNumber.setAttribute('max', maxGuests); 
            guestLabel.textContent = `Number of Guests (1 - ${maxGuests})`;

            // Adjust current guest value if out of bounds (and update if necessary)
            let currentGuests = parseInt(guestsNumber.value);
            if (currentGuests < 1) { 
                currentGuests = 1;
            } else if (currentGuests > maxGuests) {
                currentGuests = maxGuests;
            }
            // Ensure UI reflects current (or adjusted) value
            guestsNumber.value = currentGuests;
            guestsSlider.value = currentGuests;
            guestCountDisplay.textContent = currentGuests;

            // Recalculate on constraint change
            calculateEstimate();
        }

        // Attach listeners for dynamic constraints updates
        houseSelect.addEventListener('change', updateGuestConstraints);
        document.addEventListener('DOMContentLoaded', () => {
            // Set initial constraints and run initial calculation when the page loads
            updateGuestConstraints(); 
            calculateEstimate();
        }); 


        // Helper function to show messages (errors or success)
        function showMessage(text, isError = true) {
            errorMessage.textContent = text;
            messageBox.classList.remove('hidden');
            messageBox.classList.remove('bg-green-100', 'bg-red-100');
            messageBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100');
            resultContainer.classList.add('hidden');
        }

        // Helper function to hide messages
        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        function calculateEstimate() {
            hideMessage();
            
            // 1. Get Input Values
            const houseId = houseSelect.value;
            const checkIn = new Date(checkInDate.value);
            const checkOut = new Date(checkOutDate.value);
            const guests = parseInt(guestsNumber.value);

            // Get dynamic data from PRICING object
            const houseData = PRICING[houseId];
            const maxRooms = houseData.maxRooms;
            const maxGuests = houseData.maxGuests; 
            
            // 2. Validation
            if (!checkInDate.value || !checkOutDate.value) {
                resultContainer.classList.add('hidden');
                return;
            }

            if (checkOut <= checkIn) {
                showMessage("Check-out date must be after the Check-in date.");
                return;
            }

            // Guest validation logic
            if (guests < 1 || guests > maxGuests || isNaN(guests)) {
                showMessage(`Number of guests must be between 1 and ${maxGuests} for this house.`, true);
                return;
            }
            
            // 3. Determine Rooms (based on specific house logic)
            const finalRooms = getRoomsByGuestCount(houseId, guests, maxRooms);

            // 4. Calculate Nights & Costs per Day
            const checkInTime = checkIn.getTime();
            const checkOutTime = checkOut.getTime();
            
            const MS_PER_DAY = 1000 * 3600 * 24;
            let totalNights = 0;
            let totalBaseBookingCost = 0;
            let totalWeekendNights = 0;
            let totalFridayNights = 0;
            let totalWeekdayNights = 0;
            
            // --- Determine rate per night based on day type and guest count (Fixed Logic for all houses) ---
            for (let time = checkInTime; time < checkOutTime; time += MS_PER_DAY) {
                totalNights++;
                const currentDate = new Date(time);
                const dayOfWeek = currentDate.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
                
                let dailyRate = 0;
                let dayTypeLabel = '';
                
                // A. Find the correct guest tier rate object
                const rateTier = houseData.rates.find(tier => 
                    guests >= tier.guests[0] && guests <= tier.guests[1]
                );

                if (!rateTier) {
                    showMessage("Could not find a valid rate for this guest count and house. Please check guest limits.", true);
                    return;
                }

                // B. Determine the price based on day type
                if (dayOfWeek === 5) { // Friday (5)
                    dailyRate = rateTier.friday;
                    dayTypeLabel = 'Friday';
                    totalFridayNights++;
                } else if (dayOfWeek === 6) { // Saturday (6) is Weekend/Holiday
                    dailyRate = rateTier.weekend;
                    dayTypeLabel = 'Weekend/Holiday';
                    totalWeekendNights++;
                } else { // Sunday (0) to Thursday (4) are Weekday
                    dailyRate = rateTier.weekday;
                    dayTypeLabel = 'Weekday';
                    totalWeekdayNights++;
                }
                
                totalBaseBookingCost += dailyRate;
            }

            if (totalNights < 1) {
                 showMessage("Booking must be for at least one night.");
                 return;
            }

            // 5. Final Calculation
            const subtotal = totalBaseBookingCost; 
            const totalPrice = subtotal + SERVICE_FEE; // SERVICE_FEE is 0 now.

            // 6. Display Result
            const houseName = houseSelect.options[houseSelect.selectedIndex].text.split(' (')[0];

            // UPDATE ROOMS DISPLAY
            roomsRequiredDisplay.textContent = finalRooms;
            
            // UPDATE TOTAL PRICE DISPLAY
            // Using formatCurrency for separators
            totalPriceDisplay.textContent = `${CURRENCY_SYMBOL}${formatCurrency(totalPrice)}`;
            
            // Detailed breakdown 
            let detailsHtml = `
                <span class="font-semibold">${totalNights} nights</span> total at ${houseName} 
                (${guests} guests, ${finalRooms} rooms required)<br>
                <span class="font-bold">${totalWeekdayNights} Weekday night(s)</span> | 
                <span class="font-bold">${totalFridayNights} Friday night(s)</span> | 
                <span class="font-bold">${totalWeekendNights} Weekend/Holiday night(s)</span>.
            `;
            
            // Since all houses are now fixed, the label is consistent
            let baseCostLabel = 'Total Fixed Nightly Rate Cost'; 

            detailsHtml += `
                <br>${baseCostLabel}: ${CURRENCY_SYMBOL}${formatCurrency(totalBaseBookingCost)}
                <br>Total Final Price: ${CURRENCY_SYMBOL}${formatCurrency(totalPrice)}
            `;

            detailsDisplay.innerHTML = detailsHtml;
            
            resultContainer.classList.remove('hidden');
        }

        // Event listeners for dates (now also trigger calculation)
        checkInDate.addEventListener('change', () => {
            if (checkInDate.value) {
                checkOutDate.setAttribute('min', checkInDate.value);
                if (checkOutDate.value && new Date(checkOutDate.value) <= new Date(checkInDate.value)) {
                    checkOutDate.value = '';
                }
            }
            calculateEstimate();
        });
        checkOutDate.addEventListener('change', calculateEstimate);

    </script>

</body>
</html>
