<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Booking Price Estimator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind to use Inter font and custom colors if needed -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#FF5A5F', // Airbnb Red
                        'secondary': '#484848',
                        'accent': '#00A699',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom styles for smoother transitions */
        .card-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div id="app" class="w-full max-w-lg bg-white rounded-xl overflow-hidden card-shadow">
        
        <header class="bg-primary p-6 text-white text-center">
            <h1 class="text-3xl font-extrabold tracking-tight">Booking Price Estimator</h1>
            <p class="text-sm opacity-90 mt-1">Estimate the cost of your next stay.</p>
        </header>

        <main class="p-6 space-y-6">

            <!-- Input Fields -->
            <div class="space-y-4">
                
                <!-- House Selection -->
                <div>
                    <label for="houseSelect" class="block text-sm font-medium text-secondary mb-1">Select House</label>
                    <select id="houseSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 ease-in-out">
                        <option value="A" selected>The Coastal Cottage (Base Rate: $150/night)</option>
                        <option value="B">Downtown Loft (Base Rate: $220/night)</option>
                        <option value="C">Mountain Retreat (Base Rate: $180/night)</option>
                    </select>
                </div>

                <!-- Date Selection -->
                <div class="flex space-x-4">
                    <div class="w-1/2">
                        <label for="checkInDate" class="block text-sm font-medium text-secondary mb-1">Check-in Date</label>
                        <input type="date" id="checkInDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 ease-in-out">
                    </div>
                    <div class="w-1/2">
                        <label for="checkOutDate" class="block text-sm font-medium text-secondary mb-1">Check-out Date</label>
                        <input type="date" id="checkOutDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 ease-in-out">
                    </div>
                </div>

                <!-- Rooms Selection -->
                <div>
                    <label for="roomsInput" class="block text-sm font-medium text-secondary mb-1">Number of Rooms (1-4)</label>
                    <input type="number" id="roomsInput" min="1" max="4" value="1" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150 ease-in-out">
                </div>
            </div>

            <!-- Calculation Button -->
            <button id="calculateBtn" class="w-full bg-accent hover:bg-opacity-90 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 ease-in-out transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-accent focus:ring-opacity-50">
                Calculate Booking Estimate
            </button>

            <!-- Result Display -->
            <div id="resultContainer" class="p-4 bg-primary bg-opacity-10 rounded-lg border border-primary transition-all duration-300 ease-out hidden">
                <h3 class="text-xl font-bold text-primary mb-2">Estimated Total:</h3>
                <p id="totalPriceDisplay" class="text-3xl font-extrabold text-primary">$0.00</p>
                <p id="detailsDisplay" class="text-sm text-secondary mt-1"></p>
            </div>

            <!-- Error/Message Box -->
            <div id="messageBox" class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg transition-all duration-300 ease-out hidden" role="alert">
                <p id="errorMessage"></p>
            </div>
            
        </main>
    </div>

    <script>
        const houseSelect = document.getElementById('houseSelect');
        const checkInDate = document.getElementById('checkInDate');
        const checkOutDate = document.getElementById('checkOutDate');
        const roomsInput = document.getElementById('roomsInput');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultContainer = document.getElementById('resultContainer');
        const totalPriceDisplay = document.getElementById('totalPriceDisplay');
        const detailsDisplay = document.getElementById('detailsDisplay');
        const messageBox = document.getElementById('messageBox');
        const errorMessage = document.getElementById('errorMessage');

        // Define pricing structure (House, Base Rate per Night)
        const PRICING = {
            'A': 150, // The Coastal Cottage
            'B': 220, // Downtown Loft
            'C': 180, // Mountain Retreat
        };

        // Define room multipliers
        const ROOM_MULTIPLIERS = {
            1: 1.0,   // 1 room: standard rate
            2: 1.6,   // 2 rooms: 60% increase
            3: 2.1,   // 3 rooms: 110% increase
            4: 2.5,   // 4 rooms: 150% increase
        };

        // Set initial min date to today
        const today = new Date().toISOString().split('T')[0];
        checkInDate.setAttribute('min', today);
        checkOutDate.setAttribute('min', today);

        // Helper function to show messages (errors or success)
        function showMessage(text, isError = true) {
            errorMessage.textContent = text;
            messageBox.classList.remove('hidden', isError ? 'bg-green-100' : 'bg-red-100');
            messageBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100');
            resultContainer.classList.add('hidden');
        }

        // Helper function to hide messages
        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        function calculateEstimate() {
            hideMessage();
            
            // 1. Get Input Values
            const houseId = houseSelect.value;
            const checkIn = new Date(checkInDate.value);
            const checkOut = new Date(checkOutDate.value);
            const rooms = parseInt(roomsInput.value);

            // 2. Validation
            if (!checkInDate.value || !checkOutDate.value) {
                showMessage("Please select both a Check-in and Check-out date.");
                return;
            }

            if (checkOut <= checkIn) {
                showMessage("Check-out date must be after the Check-in date.");
                return;
            }

            if (rooms < 1 || rooms > 4) {
                showMessage("Number of rooms must be between 1 and 4.");
                return;
            }

            // 3. Calculate Nights
            const timeDiff = checkOut.getTime() - checkIn.getTime();
            const nights = Math.ceil(timeDiff / (1000 * 3600 * 24)); // Round up to ensure a minimum of 1 night

            if (nights < 1) {
                 showMessage("Booking must be for at least one night.");
                 return;
            }

            // 4. Calculate Price Components
            const baseRate = PRICING[houseId];
            const roomMultiplier = ROOM_MULTIPLIERS[rooms];
            
            // Additional simulated fee (e.g., Cleaning Fee, independent of nights)
            const serviceFee = 50; 
            
            // Price = (Nights * BaseRate * RoomMultiplier) + ServiceFee
            const subtotal = nights * baseRate * roomMultiplier;
            const totalPrice = subtotal + serviceFee;

            // 5. Display Result
            const houseName = houseSelect.options[houseSelect.selectedIndex].text.split(' (')[0];

            totalPriceDisplay.textContent = `$${totalPrice.toFixed(2)}`;
            detailsDisplay.innerHTML = `
                <span class="font-semibold">${nights} nights</span> at ${houseName} (${rooms} rooms) <br>
                Subtotal: $${subtotal.toFixed(2)} (Rate: $${(baseRate * roomMultiplier).toFixed(2)}/night) <br>
                Service Fee: $${serviceFee.toFixed(2)}
            `;
            
            resultContainer.classList.remove('hidden');
        }

        // Event Listener
        calculateBtn.addEventListener('click', calculateEstimate);

        // Ensure check-out date is always after check-in date
        checkInDate.addEventListener('change', () => {
            if (checkInDate.value) {
                checkOutDate.setAttribute('min', checkInDate.value);
                // If check-out is before check-in, reset it
                if (checkOutDate.value && new Date(checkOutDate.value) <= new Date(checkInDate.value)) {
                    checkOutDate.value = '';
                }
            }
        });
    </script>

</body>
</html>
